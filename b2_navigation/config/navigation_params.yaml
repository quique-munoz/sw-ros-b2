bt_navigator_rclcpp_node:
  ros__parameters:
    use_sim_time: False

controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    odom_topic: "/odom"
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] 
    controller_plugins: ["FollowPath"]
    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::PoseProgressChecker"
      required_movement_radius: 0.2
      required_movement_angle: 0.2
      movement_time_allowance: 20.0
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.04
    # RPP parameters
    # FollowPath:
    #   plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
    #   transform_tolerance: 0.2
    #   desired_linear_vel: 0.5
    #   lookahead_dist: 1.0   # fixed lookahead
    #   use_velocity_scaled_lookahead_dist: false #false means fixed lookahead
    #   min_lookahead_dist: 0.4
    #   max_lookahead_dist: 1.5
    #   lookahead_time: 2.0   # gain of lookahead, time in seconds to place carrot
    #   min_approach_linear_velocity: 0.25    # min vel when close to goal
    #   approach_velocity_scaling_dist: 0.5   # slow down when this far from goal, should be lower than costmap size
    #   use_collision_detection: true
    #   max_allowed_time_to_collision_up_to_carrot: 2.0   # not used if use_collision_detection == false, bigger=stop sooner before collision
    #   use_regulated_linear_velocity_scaling: true         # whether to slow on curves
    #   use_cost_regulated_linear_velocity_scaling: false   # whether to slow near obstacles
    #   regulated_linear_scaling_min_radius: 1.0  #radius to slow down
    #   regulated_linear_scaling_min_speed: 0.25
    #   use_fixed_curvature_lookahead: true
    #   curvature_lookahead_dist: 1.5
    #   use_rotate_to_heading: true
    #   rotate_to_heading_angular_vel: 0.65
    #   rotate_to_heading_min_angle: 0.5236  # (30º) negated when use_rotate_to_heading == false
    #   max_angular_accel: 10.0    #negated when use_rotate_to_heading == false
    #   max_robot_pose_search_dist: 10.0   #should be left as default
    #   interpolate_curvature_after_goal: false   # needs use_fixed_curvature_lookahead to be true. Maybe would help!
    #   allow_reversing: false
    #   use_cancel_deceleration: true
    #   cancel_deceleration: 10.0

    # Dynamic Window Pure Pursuit controller parameters
    FollowPath:
      plugin: "nav2_dynamic_window_pure_pursuit_controller::DynamicWindowPurePursuitController"

      # Kinematic limits
      desired_linear_vel: 0.50            
      min_linear_vel: 0.00
      max_linear_vel: 0.70
      max_angular_vel: 1.50
      max_linear_accel: 1.00
      max_linear_decel: 1.00
      max_angular_accel: 10.00

      # Dynamic window sampling
      vx_samples: 20                      # number of linear velocity samples
      wz_samples: 22                      # number of angular velocity samples
      sim_time: 1.0                       # prediction horizon (shorter = less oscillation)
      sim_step: 0.05                      # time step for trajectory simulation

      # Pure Pursuit parameters
      lookahead_dist: 1.0
      min_lookahead_dist: 0.50
      max_lookahead_dist: 1.00
      lookahead_time: 1.5                
      use_velocity_scaled_lookahead_dist: true
      use_rotate_to_heading: true
      rotate_to_heading_angular_vel: 0.60
      rotate_to_heading_min_angle: 0.32
      use_heading_from_path: false

      # Velocity scaling by curvature / goal approach
      use_velocity_scaling: true
      curvature_lookahead_dist: 0.80
      min_approach_linear_velocity: 0.4
      approach_velocity_scaling_dist: 1.0

      # Safety and collision costs
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_target: 1.0
      obstacle_cost_weight: 1.0
      path_align_weight: 12.0
      goal_align_weight: 6.0
      path_follow_weight: 6.0
      prefer_forward: true

      # Costmap scaling (must match inflation layer config)
      cost_scaling_dist: 0.50
      inflation_cost_scaling_factor: 3.0

      # Miscellaneous
      min_linear_velocity: 0.0
      max_lateral_accel: 0.20
      max_robot_pose_search_dist: 10.0
      transform_tolerance: 0.10
      use_interpolation: true

# It's important to keep these parameters updated with those of the controller
# Right now, it's super hight to allow the push from the controller
velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [1.0, 1.0, 1.25]
    min_velocity: [-1.0, -1.0, -1.25]
    max_accel: [2.0, 2.0, 2.0]
    max_decel: [-2.0, -2.0, -2.0]    # Higher linear decel to allow faster stop
    odom_topic: "/odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.5

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: False
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.3
      plugins: ["obstacle_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: False
        inflation_radius: 1.0
        cost_scaling_factor: 3.0
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        tf_filter_tolerance: 0.2
        inf_is_valid: True
        observation_sources: scan_accumulated
        min_obstacle_height: -2.0
        max_obstacle_height: 2.0
        scan_accumulated:
          topic: /scan_accumulated
          clearing: True
          marking: True
          data_type: "LaserScan"
          min_obstacle_height: -2.0
          max_obstacle_height: 2.0
          raytrace_max_range: 50.0
          raytrace_min_range: 0.0
          obstacle_max_range: 10.0
          obstacle_min_range: 0.0
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: True
      robot_radius: 0.4
      # resolution: 0.05
      trinary_costmap: True
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        tf_filter_tolerance: 0.2
        inf_is_valid: True
        observation_sources: scan_accumulated
        footprint_clearing_enabled: true
        min_obstacle_height: -2.0
        max_obstacle_height: 2.0
        scan_accumulated:
          topic: /scan_accumulated
          clearing: True
          marking: True
          data_type: "LaserScan"
          min_obstacle_height: -2.0
          max_obstacle_height: 2.0
          raytrace_max_range: 50.0
          raytrace_min_range: 0.0
          obstacle_max_range: 50.0
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 2.0
      always_send_full_costmap: True

map_server:
  ros__parameters:
    use_sim_time: False
    yaml_filename: "map.yaml"

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

