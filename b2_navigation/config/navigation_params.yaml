planner_server:
  ros__parameters:
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      tolerance: 0.25                 # tolerancia a goal (m)
      downsample_costmap: false
      cost_travel_multiplier: 2.0     # penaliza zonas “caras”
      angle_quantization_bins: 72     # resolución angular (72 => 5°)
      minimum_turning_radius: 0.1     # radio mínimo (ajústalo a tu B2)
      cache_obstacle_heuristic: true
      allow_unknown: true
      use_astar: true
      analytic_expansion: true        # atajo directo al goal cuando hay LoS
      smooth_path: true               # suavizado post-plan
      max_iterations: 200000
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true
        refinement_num: 2

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap
    global_costmap_topic: global_costmap/costmap
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    behavior_plugins: ["wait", "omni_unstuck"]
    wait:
      plugin: "nav2_behaviors/Wait"
    omni_unstuck:
      plugin: "omni_unstuck_behavior/OmniUnstuck"
      max_dist: 1.0
      min_linear_speed: 0.4
      max_linear_speed: 1.0
      min_angular_speed: 0.4
      max_angular_speed: 1.0
      angular_speed_gain: 1.0
      collision_array_size: 16
      goal_dist_threshold: 0.1
      goal_angle_threshold: 0.1

waypoint_follower:
  ros__parameters:
    loop_rate: 200
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"   
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200
